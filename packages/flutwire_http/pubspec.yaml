name: flutwire_http
description: >-
  A package:http client for Flutwire. It records the calls that the dart:io
  capture cannot see, such as every call on the web.
version: 1.0.1
repository: https://github.com/NaCode-Studios/Flutwire
issue_tracker: https://github.com/NaCode-Studios/Flutwire/issues
funding:
  - https://github.com/sponsors/NaCode-Studios

topics:
  - http
  - networking
  - debugging
  - inspector

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutwire: ^1.0.1
  http: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
