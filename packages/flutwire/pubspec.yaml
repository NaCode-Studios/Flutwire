name: flutwire
description: >-
  Network inspector for Flutter. Records the HTTP calls your app makes, keeps
  them across restarts, and opens them from a notification in the shade.
version: 1.0.1
repository: https://github.com/NaCode-Studios/Flutwire
issue_tracker: https://github.com/NaCode-Studios/Flutwire/issues
funding:
  - https://github.com/sponsors/NaCode-Studios

topics:
  - http
  - networking
  - debugging
  - inspector
  - notifications

# Taken from the example app on a device. The first one is the picture the
# package list shows.
screenshots:
  - description: The notification in the shade lists the latest calls and opens the inspector.
    path: screenshots/shade.png
  - description: The list of calls, with status, method, host and timing, and the totals on top.
    path: screenshots/list.png
  - description: A JSON body as a tree that collapses and expands.
    path: screenshots/body-json.png
  - description: Search across URLs, status codes, headers and the text of bodies.
    path: screenshots/search.png
  - description: Credentials are masked when a call is recorded, so they never reach the disk.
    path: screenshots/headers.png
  - description: Two calls side by side, with each difference marked where it happens.
    path: screenshots/compare.png
  - description: Error rate, percentiles and the slowest calls, with a timeline.
    path: screenshots/statistics.png
  - description: The inspector docked under the app, with a request held at a breakpoint.
    path: screenshots/dock.png
  - description: Mocks and breakpoints. A line says what is in force and every call a rule touched is marked.
    path: screenshots/rules.png
  - description: The same notification on iOS, on the lock screen.
    path: screenshots/lock-screen-ios.jpg

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  dio: ^5.11.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  fonts:
    # DM Sans and DM Mono, cut down to the Latin range: DM Sans at its display
    # optical size for headlines and at its text size for prose, DM Mono for
    # anything a machine produced. About 120 KB together.
    - family: FlutwireDisplay
      fonts:
        - asset: fonts/FlutwireDisplay-SemiBold.ttf
          weight: 600
    - family: FlutwireText
      fonts:
        - asset: fonts/FlutwireText-Regular.ttf
        - asset: fonts/FlutwireText-SemiBold.ttf
          weight: 600
    - family: FlutwireMono
      fonts:
        - asset: fonts/FlutwireMono-Regular.ttf
        - asset: fonts/FlutwireMono-SemiBold.ttf
          weight: 600
  plugin:
    platforms:
      android:
        package: it.nacodestudios.flutwire
        pluginClass: FlutwirePlugin
      ios:
        pluginClass: FlutwirePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutwirePlugin
        sharedDarwinSource: true
