name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same checks as every pull request, called rather than copied: two lists
  # of test commands drift the moment a package is added to one of them, and a
  # tag then proves here what a checklist would only ask someone to look at.
  verify:
    uses: ./.github/workflows/ci.yaml

  # pub.dev authenticates the upload over OIDC against the repository and tag
  # pattern configured on each package, so there is no token to hold.
  # dart-lang/setup-dart exchanges the job's id-token for a short-lived pub.dev
  # credential, which is also what earns the verified publisher line on the
  # package page.
  #
  # Written out rather than calling setup-dart's own publish workflow, which
  # runs `dart pub publish`. A Dart SDK on its own cannot resolve a package that
  # depends on Flutter, and all four of these do.
  #
  # The two third-party actions are pinned to a commit, with the release in the
  # comment for Dependabot to read. These jobs hold id-token: write, so whatever
  # an action runs here can publish as this repository, and a tag that moves
  # would let a changed action do exactly that.
  publish-core:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # One resolution for the whole workspace, as in CI.
      - run: flutter pub get
      - run: flutter pub publish --force
        working-directory: packages/flutwire

  # The adapters declare flutwire ^X.Y.Z, and pub.dev refuses a package whose
  # dependencies do not resolve. Publishing them in the same run therefore means
  # waiting for the version uploaded a minute ago to be servable, which the
  # upload response itself says can take up to ten minutes.
  await-core:
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the core version to be resolvable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 60); do
            if curl -sf "https://pub.dev/api/packages/flutwire" \
                 | jq -e --arg v "$VERSION" 'any(.versions[]; .version == $v)' > /dev/null; then
              echo "flutwire $VERSION is servable"
              exit 0
            fi
            sleep 15
          done
          echo "::error::flutwire $VERSION was not servable within 15 minutes"
          exit 1

  # Listed rather than globbed: a package added without a line here should fail
  # review, not be skipped because nothing was looking for it. Each adapter is
  # independent once the core is there, so one failing to upload does not stop
  # the others.
  publish-adapters:
    needs: await-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [flutwire_dio, flutwire_http, flutwire_cloud_functions]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --force
        working-directory: packages/${{ matrix.package }}

  # Deliberately not downstream of the publish jobs. The Release object is
  # derived from the tag and the changelog and is true whatever pub.dev did, and
  # chaining it would mean a re-run after a partial publish fails on the package
  # that already went up, taking the record with it.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # The default read cannot create a release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Tags do not populate the Releases panel, so a repository with tags and
      # no Release objects reads as one that has never shipped. The body is
      # extracted from CHANGELOG.md and never written by hand: a release note
      # composed separately is a second copy of what the changelog owns, and it
      # will eventually disagree with it.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1     { found = 1; next }
            found && /^## \[/        { exit }
            # The oldest section is followed by the compare links rather than by
            # another heading, so it needs its own terminator or the release
            # notes end in a list of URLs.
            found && /^\[[^]]+\]: /  { exit }
            found                    { print }
          ' CHANGELOG.md > notes.md
          # An empty body means the tag and the changelog disagree about what
          # this version is. Fail rather than publish a blank release, which is
          # the drift this arrangement exists to prevent.
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # SLSA build provenance, which is what turns a linked artifact from a listing
  # into a verifiable one:
  #
  #   gh attestation verify <archive> --repo NaCode-Studios/Flutwire
  #
  # The usual rule is to attest before publishing, so that a failed attestation
  # cannot leave an artifact released without one. That is not available here:
  # the archive is built inside `flutter pub publish` and never lands on the
  # runner as a file, so the only digest that exists is the one pub.dev serves
  # after the upload. The attestation is therefore made by digest and afterwards,
  # and a failure leaves a published version unattested until the job is re-run.
  # That is a real gap and it is why this job is not `continue-on-error`.
  #
  # The attested set is derived from which packages are publishable rather than
  # listed here, so a package that stops being held back is covered the day its
  # publish_to line goes.
  attest:
    needs: [publish-core, publish-adapters]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # The archive of the tagged version, looked up by that version. The page of
      # a package names its `latest`, and that can still be the previous version
      # for minutes after an upload: on 1.0.0 it was for two of the four packages
      # when the record job read it. Read here, it would attest the archive that
      # was already attested and leave the new one without.
      - name: Collect the published archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          : > checksums.txt
          for pubspec in packages/*/pubspec.yaml; do
            grep -q '^publish_to: none' "$pubspec" && continue
            pkg=$(basename "$(dirname "$pubspec")")
            for _ in $(seq 1 40); do
              curl -sf "https://pub.dev/api/packages/$pkg/versions/$VERSION" > meta.json && break
              sleep 15
            done
            sha=$(jq -re '.archive_sha256' meta.json) || {
              echo "::error::pub.dev has no $pkg $VERSION"; exit 1; }
            echo "$sha  $pkg-$VERSION.tar.gz" >> checksums.txt
          done
          [ -s checksums.txt ] || { echo "::error::no publishable package found"; exit 1; }
          cat checksums.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: checksums.txt

  # Metadata, not a second distribution channel: nobody resolves a dependency
  # from the Packages panel. It says what this repository built and which
  # registry holds it, keyed on the digest pub.dev serves the archive under.
  #
  # It cannot fail the release. The endpoint is org-scoped, its write permission
  # is undocumented, and a metadata step that can undo a successful publish is
  # worth less than the metadata. If a 404 turns out to be permission rather than
  # a missing artifact, a PAT with artifact-metadata goes in
  # ARTIFACT_METADATA_TOKEN and this starts working with no change here.
  #
  # The API documents no DELETE, so a record is permanent and a duplicate cannot
  # be cleaned up: check before writing.
  #
  # Not downstream of the attestation. The check on that page comes from the
  # attestation and attaches to the record by digest, in whichever order the two
  # arrive, and an attestation this plan may refuse must not take the metadata
  # with it.
  link-artifacts:
    needs: [publish-core, publish-adapters]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # The archive of the tagged version, looked up by that version, because the
      # `latest` of a package can still be the previous one for minutes after an
      # upload and the record would then name an archive that already has one.
      - name: Record the published archives
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_METADATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pubspec in packages/*/pubspec.yaml; do
            grep -q '^publish_to: none' "$pubspec" && continue
            pkg=$(basename "$(dirname "$pubspec")")
            for _ in $(seq 1 40); do
              curl -sf "https://pub.dev/api/packages/$pkg/versions/$VERSION" > meta.json && break
              sleep 15
            done
            sha=$(jq -re '.archive_sha256' meta.json) || {
              echo "::warning::pub.dev has no $pkg $VERSION"; continue; }
            url=$(jq -re '.archive_url' meta.json)
            ver="$VERSION"
            if gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/sha256:$sha/metadata/storage-records" \
                 --silent 2>/dev/null; then
              echo "already recorded: $pkg $ver"
              continue
            fi
            # Two forms, because the endpoint resolves which repository built
            # the artifact from its attestation, and an archive without one has
            # nothing to resolve: it answers "no artifacts found" until the
            # repository is named outright. The bare name is required; the
            # owner/repo form is rejected.
            record() {
              gh api -X POST "/orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/metadata/storage-record" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -f name="$pkg" -f version="$ver" -f digest="sha256:$sha" \
                -f registry_url="https://pub.dev/" -f artifact_url="$url" \
                -f status="active" "$@" --silent
            }
            record || record -f github_repository="${GITHUB_REPOSITORY#*/}" \
              || echo "::warning::could not record $pkg $ver"
          done
