name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yaml calls this rather than restating the job list, so the gate a
  # tag has to pass is the same one every pull request passes, by construction.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # One resolution for the whole workspace. Every member is a Flutter
      # package, so a single `flutter pub get` is the only pub command needed.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: flutter analyze --fatal-infos
      # Listed rather than globbed: a package added without a suite should fail
      # review here, not pass because nothing was looking for it.
      - run: flutter test
        working-directory: packages/flutwire
      - run: flutter test
        working-directory: packages/flutwire_dio
      - run: flutter test
        working-directory: packages/flutwire_http
      - run: flutter test
        working-directory: packages/flutwire_cloud_functions

  # The plugin has native halves that `flutter analyze` never reads. Building
  # the example app is what compiles them, so a Kotlin or Swift error fails
  # here and not on a stranger's machine.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: packages/flutwire/example

  # The Swift halves can only be compiled on a Mac.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: packages/flutwire/example
      - run: flutter build macos --debug
        working-directory: packages/flutwire/example
