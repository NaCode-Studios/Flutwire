name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yaml calls this rather than restating the job list, so the gate a
  # tag has to pass is the same one every pull request passes, by construction.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # One resolution for the whole workspace. Every member is a Flutter
      # package, so a single `flutter pub get` is the only pub command needed.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: flutter analyze --fatal-infos
      # Listed rather than globbed: a package added without a suite should fail
      # review here, not pass because nothing was looking for it.
      - run: flutter test
        working-directory: packages/flutwire
      - run: flutter test
        working-directory: packages/flutwire_dio
      - run: flutter test
        working-directory: packages/flutwire_http
      - run: flutter test
        working-directory: packages/flutwire_cloud_functions

  # Everything `flutter pub publish` checks without uploading: the pubspec, the
  # files that would ship, and a changelog that mentions the version being
  # released. It is the command the release runs minus the upload, so a warning
  # shows up on the pull request and not on the tag.
  publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
        working-directory: packages/flutwire
      - run: flutter pub publish --dry-run
        working-directory: packages/flutwire_dio
      - run: flutter pub publish --dry-run
        working-directory: packages/flutwire_http
      - run: flutter pub publish --dry-run
        working-directory: packages/flutwire_cloud_functions

  # pub.dev takes twenty points from a package that no longer compiles at the
  # lowest versions its constraints allow, and a constraint nobody tested is a
  # promise that breaks on a stranger's machine. A workspace resolves all its
  # members together, so a constraint raised by one member hides a stale one in
  # another: each package is copied out and resolved on its own. The adapters
  # take the core from this checkout, so they are judged against the core they
  # will ship with.
  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test each package at its lowest versions
        run: |
          for pkg in flutwire flutwire_dio flutwire_http flutwire_cloud_functions; do
            echo "::group::$pkg"
            work="$RUNNER_TEMP/$pkg"
            cp -R "packages/$pkg" "$work"
            sed -i '/^resolution: workspace/d' "$work/pubspec.yaml"
            if [ "$pkg" = flutwire ]; then
              # The example app is a package of its own, resolved with the workspace.
              rm -rf "$work/example"
            else
              printf 'dependency_overrides:\n  flutwire:\n    path: %s\n' \
                "$PWD/packages/flutwire" >> "$work/pubspec.yaml"
            fi
            (cd "$work" && flutter pub downgrade && flutter analyze && flutter test)
            echo "::endgroup::"
          done

  # A version number is a promise about the public API, and nothing else checks
  # it. Each package is compared with its latest release on pub.dev, and the job
  # fails when the API breaks and the pubspec has not moved to a version that
  # allows it: from 1.0 a removed or changed member needs the next major.
  # STABILITY.md says what each kind of change means.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate dart_apitool 0.23.2
      - name: Compare each package with its latest release
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          status=0
          for pkg in flutwire flutwire_dio flutwire_http flutwire_cloud_functions; do
            latest=$(curl -fsS "https://pub.dev/api/packages/$pkg" | jq -r .latest.version)
            echo "::group::$pkg against $latest"
            dart-apitool diff --old "pub://$pkg/$latest" --new "packages/$pkg" \
              --version-check-mode onlyBreakingChanges || status=1
            echo "::endgroup::"
          done
          exit $status

  # The plugin has native halves that `flutter analyze` never reads. Building
  # the example app is what compiles them, so a Kotlin or Swift error fails
  # here and not on a stranger's machine.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: packages/flutwire/example

  # The web has no dart:io, so it is where the adapters do the recording and
  # where the example is compiled by a different compiler than anywhere else.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web
        working-directory: packages/flutwire/example

  # The Swift halves can only be compiled on a Mac.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: packages/flutwire/example
      - run: flutter build macos --debug
        working-directory: packages/flutwire/example
