# The Dart workspace resolves every package from the root, so one pub entry at
# the root covers all of them. Gradle and Swift Package Manager are left out on
# purpose: the example app's native projects are generated by the Flutter tool.
version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch routine minor/patch bumps into a single PR to cut noise. Majors
      # stay separate on purpose: they are the ones worth reading.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
